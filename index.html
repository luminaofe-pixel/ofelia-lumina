<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina | Tu opinión brilla</title>
<style>
  *{box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif;}
  body{margin:0; background:#000000; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; color:#fff;}
  .card{width:100%; max-width:560px; background:#111111; border:2px solid #d4af37; border-radius:28px; padding:28px; box-shadow:0 0 35px rgba(212,175,55,.30); overflow:hidden; position:relative; text-align:center;}
  .card:before{content:""; position:absolute; top:0; left:0; right:0; height:6px; background:linear-gradient(90deg,#a67c00,#ffe89a,#a67c00);}
  .logo{width:100%; max-width:380px; display:block; margin:5px auto 0; border-radius:14px;}
  .sub{text-align:center; color:#e8c873; font-size:15px; margin:12px 0 18px; line-height:1.5;}
  .pregunta{font-size:24px; font-weight:800; color:#ffffff; line-height:1.2;}
  .desc{color:#cbb87a; font-size:14px; margin-top:8px; line-height:1.5;}
  .boton{display:inline-block; margin-top:22px; background:linear-gradient(90deg,#a67c00,#ffe89a); color:#000; padding:18px 32px; font-size:20px; font-weight:800; border-radius:16px; text-decoration:none; box-shadow:0 0 20px rgba(212,175,55,.4);}
  .boton:active{transform:scale(0.97);}
  .mini{margin-top:16px; font-size:12px; color:#9a8f6a;}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://i.imgur.com/8QwKzXv.png" alt="LUMINA">
    <p class="sub">Tu opinión hace que LUMINA brille más ✨</p>

    <div class="pregunta">¿Nos ayudás con tu opinión?</div>
    <p class="desc">Te lleva 1 minuto.<br>Contanos qué te gustó, qué estilo te gusta más y qué mejorarías.</p>

    <a class="boton" href="https://forms.gle/8PMgDShsqmGeceWM7" target="_blank">✨ ¡HACER MI ENCUESTA! ✨</a>

    <p class="mini">Al tocar el botón se abre la encuesta oficial de LUMINA.<br>Tus respuestas se guardan automáticamente.</p>
  </div>
</body>
</html>
